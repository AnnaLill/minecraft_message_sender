plugins {
    id 'fabric-loom' version '1.5-SNAPSHOT'
    id 'java'
    id 'com.google.protobuf' version '0.9.4'
}

group = 'org.example'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    maven { url "https://maven.kyrptonaught.dev" }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.7"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.16.14"
    modImplementation("net.fabricmc.fabric-api:fabric-api:0.128.0+1.21.7") {
        exclude group: "net.fabricmc.fabric-api", module: "fabric-loot-api-v3"
        exclude group: "net.fabricmc.fabric-api", module: "fabric-loot-api-v2"
        exclude group: "net.fabricmc.fabric-api", module: "fabric-object-builder-api-v1"
        exclude group: "net.fabricmc.fabric-api", module: "fabric-data-attachment-api-v1"
    }
    implementation "com.google.protobuf:protobuf-java:3.25.3"
    implementation "org.postgresql:postgresql:42.7.3"
    implementation "org.hibernate.orm:hibernate-core:6.5.0.Final"
    implementation "jakarta.persistence:jakarta.persistence-api:3.1.0"
    
    // Test dependencies
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.1"
    testImplementation "org.mockito:mockito-core:5.8.0"
    testImplementation "org.mockito:mockito-junit-jupiter:5.8.0"
    testImplementation "org.assertj:assertj-core:3.25.3"
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.25.3"
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java { }
            }
        }
    }
}

sourceSets {
    main {
        java.srcDirs += 'build/generated/source/proto/main/java'
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

tasks.named('compileJava').configure { dependsOn('generateProto') }